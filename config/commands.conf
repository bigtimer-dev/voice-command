# voice-command phrases: <regex><TAB><shell command>
# The spoken text is lowercased, accents and punctuation removed, then matched
# against the regex: either the whole sentence or inside a longer one
# ("I want to open the terminal"). A pattern written ^...$ must be the whole sentence
# (used for shutdown, restart and close window, so "how do I restart my computer"
# never restarts it). A line whose command uses $VC_NUM only matches if a number was said.
# Test without the mic:  voice-command --match "open agent"

# --- commands with a value: each (.+) becomes $VC_ARG (first) / $VC_ARG2 (second)
(play|put on|search|find|look for) (.+) (on|in) spotify|(play|put on|search|find) (on |in )?spotify (for )?(.+)|spotify (play|search) (.+)	voice-spotify "$VC_ARG"
(pon|ponme|reproduce|busca|buscame|toca) (.+) en spotify|(pon|ponme|reproduce|busca|buscame|toca) (en )?spotify (.+)	voice-spotify "$VC_ARG"
(search|look up|find|look for) (on |in )?youtube (for )?(.+)|(play|put on|show me) (.+) on youtube	omarchy-launch-webapp "https://www.youtube.com/results?search_query=$(jq -rn --arg q "$VC_ARG" '$q|@uri')"
(busca|buscar|buscame|busques|pon|ponme|reproduce) (en )?youtube (.+)|(pon|ponme|reproduce|busca|buscame) (.+) en youtube	omarchy-launch-webapp "https://www.youtube.com/results?search_query=$(jq -rn --arg q "$VC_ARG" '$q|@uri')"
(search (for|google for|the web for|the internet for|online for|on google for|on google|google)|google|look up) (.+)	omarchy-launch-browser "https://www.google.com/search?q=$(jq -rn --arg q "$VC_ARG" '$q|@uri')"
(busca|buscar|buscame|busques) (en google|en internet|en la web)( de| sobre)? (.+)|(busca|buscame|busques) (informacion|info) (de |sobre )?(.+)	omarchy-launch-browser "https://www.google.com/search?q=$(jq -rn --arg q "$VC_ARG" '$q|@uri')"
remind me (in|after) (.+)	voice-remind --split "$VC_ARG" "${VC_LANG:-en}"
remind me (to|about|that) (.+) in (.+)	voice-remind "$VC_ARG2" "$VC_ARG" "${VC_LANG:-en}"
(recuerdame|recuerdeme|recordarme|recuerdes) (en|dentro de) (.+)	voice-remind --split "$VC_ARG" es
(recuerdame|recuerdeme|recordarme|recuerdes) (que|de|para) (.+) (en|dentro de) (.+)	voice-remind "$VC_ARG2" "$VC_ARG" es
(set|start) (a |an )?(timer|alarm) (for|of) (.+)	voice-remind "$VC_ARG" "Timer done" "${VC_LANG:-en}"
(.+) timer	[ -n "$VC_NUM" ] && voice-remind "$VC_ARG" "Timer done" "${VC_LANG:-en}"
(pon|poner|ponme|inicia|activa) (un |una )?(temporizador|timer|alarma|cronometro) (de|por|para|en) (.+)	voice-remind "$VC_ARG" "Temporizador terminado" es

(open|opened) (the |an |a )?(agent|agents|a gent|ajent)	cd ~ && omarchy-launch-tui --app-id=org.omarchy.claude claude
(open|opened) (the |a )?(browser|browsers|brave|web browser)	omarchy-launch-browser
(open|opened) (the |a )?(terminal|terminals|console|shell)	omarchy-launch-terminal
(open|opened) (the |my )?(files|file|file manager|folder|folders|nautilus)	uwsm-app -- nautilus --new-window
(open|opened) (the )?(spotify|spotty|spot if i|spot ify|music)	omarchy-launch-spotify
^(please )?(close|clothes) (the |this |that )?(window|windows)( please| now)?$	hyprctl dispatch 'hl.dsp.window.close()'
^(close|close it|close this|close that)$	hyprctl dispatch 'hl.dsp.window.close()'
(make )?(full ?screen|full screen) ?(the |this )?(window)?|(the |this )?window full ?screen|(exit|leave) full ?screen	hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = "fullscreen" })'
(open|opened|show) (the |my )?(settings|setting|setup|set up|preferences|config)	omarchy-menu summon setup
^(please )?(turn off|shut down|shutdown|power off|switch off) (the |my |this )?(pc|computer|p c|machine|system)( please| now)?$	voice-shutdown
^(please )?(restart|reboot|re start|restarts) (the |my |this )?(pc|computer|p c|machine|system)( please| now)?|reboot$	voice-shutdown reboot
(lock) (the |my |this )?(screen|pc|computer|p c|system)|^lock( it)?$	omarchy-system-lock
(open|opened|show) (the )?(youtube|you tube|youtube com|u tube)	omarchy-launch-webapp https://youtube.com/

# --- media (works with Spotify, YouTube, browsers: whatever is playing)
(play|pause|resume|stop|continue) (the )?(music|song|video|track|spotify)?|^(play|pause|resume)$	omarchy-shell media playPause
(next|skip) (the )?(song|track|video)|^(next|skip)$	omarchy-shell media next
(previous|last|go back) (the )?(song|track|video)	omarchy-shell media previous

# --- volume ($VC_NUM = number said in the sentence)
(set )?(the )?volume (to|at) [a-z0-9 ]+|^volume [a-z0-9 ]+$	wpctl set-volume @DEFAULT_AUDIO_SINK@ "$VC_NUM%" && omarchy-audio-output-volume +0
(volume up|turn (it |the volume )?up|louder|raise (the )?volume)	omarchy-audio-output-volume +10
(volume down|turn (it |the volume )?down|quieter|lower (the )?volume)	omarchy-audio-output-volume -10
(mute|unmute)( (the )?(sound|audio|volume|pc|computer))?	omarchy-audio-output-volume mute-toggle

# --- workspaces (move before switch: "move window to workspace 2")
(move|send|put) (the |this )?window to (the )?workspace [a-z0-9]+	hyprctl dispatch "o.workspaces.move_window($VC_NUM)"
(go|switch|change|jump) to (the )?workspace [a-z0-9]+|^workspace [a-z0-9]+$	hyprctl dispatch "o.workspaces.focus($VC_NUM)"

# ===================== Español =====================
# (acentos y puntuación se quitan antes de comparar: "abrí" = "abri")
(abre|abrir|abra|abras|abreme|abrame|abri) (el |un |al )?(agente|claude|clod)	cd ~ && omarchy-launch-tui --app-id=org.omarchy.claude claude
(abre|abrir|abra|abras|abreme|abrame|abri) (el |un )?(navegador|browser|brave|internet)	omarchy-launch-browser
(abre|abrir|abra|abras|abreme|abrame|abri) (la |una |el )?(terminal|consola)	omarchy-launch-terminal
(abre|abrir|abra|abras|abreme|abrame|abri) (los |mis |el |las )?(archivos|ficheros|carpetas|explorador( de archivos)?|administrador de archivos)	uwsm-app -- nautilus --new-window
(abre|abrir|abra|abras|abreme|abrame|abri|pon|ponme|pongas) (el |la )?(spotify|musica)	omarchy-launch-spotify
(abre|abrir|abra|abras|abreme|abrame|abri|pon|ponme|pongas) (el )?(youtube|you tube)	omarchy-launch-webapp https://youtube.com/
(abre|abrir|abra|abras|abreme|abrame|abri) (la |los |las )?(configuracion|ajustes|preferencias)	omarchy-menu summon setup
^(por favor )?(cierra|cerrar|cierre|cierres) (la |esta |esa )?ventana( por favor| ya)?|(cierra|cierralo|cierrala|cerrar)$	hyprctl dispatch 'hl.dsp.window.close()'
(pon|poner|pone) (la |esta |esa )?ventana (en )?pantalla completa|^pantalla completa$|(sal|salir|quita) (de |la )?pantalla completa	hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = "fullscreen" })'
(bloquea|bloquear|bloquee) (la |el |mi )?(pantalla|pc|computadora|compu|ordenador|equipo|sesion)	omarchy-system-lock
^(por favor )?(apaga|apagar|apague) (la |el |mi )?(pc|computadora|compu|ordenador|equipo|maquina)( por favor| ya)?$	voice-shutdown
^(por favor )?(reinicia|reiniciar|reinicie) (la |el |mi )?(pc|computadora|compu|ordenador|equipo|maquina)( por favor| ya)?$	voice-shutdown reboot

# medios
(pausa|pausar|pon pausa|reproduce|reproducir|reanuda|reanudar|continua|continuar|para|deten|detener) (la |el )?(musica|cancion|video|spotify)|^(pausa|reproduce|reanuda|continua)$	omarchy-shell media playPause
(siguiente|proxima|otra) (cancion|pista|video)|(pasa|salta|cambia) (la |de )?(cancion|pista)|^(siguiente|salta)$	omarchy-shell media next
(cancion|pista|video) anterior|(la )?anterior (cancion|pista)|(vuelve|regresa) (a )?la (cancion|pista) anterior	omarchy-shell media previous

# volumen
(pon |poner |sube |baja )?(el )?volumen (a|al|en) [a-z0-9 ]+|^volumen [a-z0-9 ]+$	wpctl set-volume @DEFAULT_AUDIO_SINK@ "$VC_NUM%" && omarchy-audio-output-volume +0
(sube|subir|aumenta|aumentar) (el )?(volumen|sonido)|(mas|bien) (alto|fuerte)|volumen arriba	omarchy-audio-output-volume +10
(baja|bajar|disminuye|disminuir) (el )?(volumen|sonido)|mas (bajo|bajito|suave)|volumen abajo	omarchy-audio-output-volume -10
(silencia|silenciar|mutea|mutear|desmutea)( (el )?(sonido|audio|volumen))?|(quita|activa|pon) el sonido	omarchy-audio-output-volume mute-toggle

# espacios de trabajo (mover antes que cambiar)
(mueve|mover|manda|mandar|pasa|pon|lleva) (la |esta |esa )?ventana (al|a|en el) (espacio( de trabajo)?|escritorio|workspace) [a-z0-9]+	hyprctl dispatch "o.workspaces.move_window($VC_NUM)"
(ve|ir|vamos|cambia|cambiar|pasa|ir|llevame) (al|a) (espacio( de trabajo)?|escritorio|workspace) [a-z0-9]+|^(espacio|escritorio) [a-z0-9]+$	hyprctl dispatch "o.workspaces.focus($VC_NUM)"
